name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Tipos e build
        run: npm run build
      - name: Testes da lógica (resumos, importação, extratos)
        run: npm test
      - name: Testes das regras de segurança (emulador Firestore)
        run: npm run test:rules
